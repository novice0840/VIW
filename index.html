<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voxel Game - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-size: 24px; pointer-events: none;
      text-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #info {
      position: absolute; top: 12px; left: 12px;
      color: rgba(255,255,255,0.6); font: 13px monospace;
      pointer-events: none;
    }
    #no-webgpu {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      color: #f66; font: 16px sans-serif; text-align: center;
    }
    /* 핫바 — 슬롯은 JS가 HOTBAR 배열을 순회하며 생성한다 */
    #hotbar {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 2px;
      padding: 3px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #2b2b2b;
      pointer-events: none;
    }
    .slot {
      position: relative;
      width: 48px; height: 48px;
      background: rgba(139,139,139,0.4);
      border: 2px solid #373737;
    }
    /* 선택 표시 — 마크처럼 슬롯보다 큰 흰 테두리가 칸을 감싼다 */
    .slot.selected {
      outline: 3px solid #fff;
      outline-offset: 1px;
      z-index: 1;
    }
    /* 블록 아이콘 — 아틀라스 타일 하나를 배경으로 보여준다 (배경 위치는 JS가 지정) */
    .slot-icon {
      position: absolute; inset: 6px;
      background-repeat: no-repeat;
      image-rendering: pixelated; /* 16px 픽셀 아트를 흐리지 않고 확대 */
    }
    .slot-key {
      position: absolute; right: 2px; bottom: 0;
      color: #fff; font: bold 12px monospace;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.9);
    }
    /* 블록 이름 — 선택이 바뀔 때 잠깐 떴다가 사라진다 */
    #block-name {
      position: absolute; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      color: #fff; font: 15px monospace;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.9);
      opacity: 0; transition: opacity 0.4s;
      pointer-events: none;
    }
    #block-name.show { opacity: 1; transition: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="crosshair">+</div>
  <div id="info">Click to play · WASD to move · Space to jump · F to fly (Space/Shift up/down) · Mouse to look · L-click break · R-click place</div>
  <div id="no-webgpu">
    WebGPU is not supported in this browser.<br />
    Try Chrome 113+ or Edge 113+.
  </div>
  <div id="block-name"></div>
  <div id="hotbar"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
