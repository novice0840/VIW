<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Voxel Game - WebGPU</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-size: 24px; pointer-events: none;
      text-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    #no-webgpu {
      display: none;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      color: #f66; font: 16px sans-serif; text-align: center;
    }
    /* 핫바 — 슬롯은 JS가 HOTBAR 배열을 순회하며 생성한다 */
    #hotbar {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 2px;
      padding: 3px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #2b2b2b;
      pointer-events: none;
    }
    .slot {
      position: relative;
      width: 48px; height: 48px;
      background: rgba(139,139,139,0.4);
      border: 2px solid #373737;
    }
    /* 선택 표시 — 마크처럼 슬롯보다 큰 흰 테두리가 칸을 감싼다 */
    .slot.selected {
      outline: 3px solid #fff;
      outline-offset: 1px;
      z-index: 1;
    }
    /* 블록 아이콘 — 아틀라스 타일 하나를 배경으로 보여준다 (배경 위치는 JS가 지정) */
    .slot-icon {
      position: absolute; inset: 6px;
      background-repeat: no-repeat;
      image-rendering: pixelated; /* 16px 픽셀 아트를 흐리지 않고 확대 */
    }
    .slot-key {
      position: absolute; right: 2px; bottom: 0;
      color: #fff; font: bold 12px monospace;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.9);
    }
    /* 블록 이름 — 선택이 바뀔 때 잠깐 떴다가 사라진다 */
    #block-name {
      position: absolute; bottom: 80px; left: 50%;
      transform: translateX(-50%);
      color: #fff; font: 15px monospace;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.9);
      opacity: 0; transition: opacity 0.4s;
      pointer-events: none;
    }
    #block-name.show { opacity: 1; transition: none; }
    /* 디버그 HUD — F3으로 켜고 끈다. 줄바꿈과 정렬을 위해 pre로 표시한다 */
    #debug {
      display: none;
      position: absolute; top: 8px; left: 8px;
      padding: 6px 8px;
      background: rgba(0,0,0,0.55);
      color: #fff; font: 12px/1.4 monospace;
      white-space: pre;
      pointer-events: none;
    }
    /* 시작 화면과 일시정지 메뉴 — 둘 다 화면 전체를 덮는 오버레이다 */
    .overlay {
      display: none;
      position: absolute; inset: 0; z-index: 10;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      color: #fff; font: 15px sans-serif;
    }
    #world-menu { background: #1e1e1e; overflow-y: auto; padding: 32px 16px; justify-content: flex-start; }
    #pause-menu { background: rgba(0,0,0,0.6); }
    .overlay h1 { font: bold 28px monospace; text-shadow: 2px 2px 0 #000; }
    .overlay h2 { font: bold 16px monospace; color: #ccc; align-self: flex-start; }
    .panel { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px; }
    .overlay button {
      padding: 8px 16px;
      background: #6b6b6b; color: #fff;
      border: 2px solid #2b2b2b; border-top-color: #a0a0a0; border-left-color: #a0a0a0;
      font: 14px sans-serif; cursor: pointer;
    }
    .overlay button:hover:not(:disabled) { background: #7d8ac0; }
    .overlay button:disabled { opacity: 0.45; cursor: default; }
    .overlay button.danger:hover:not(:disabled) { background: #b04a4a; }
    #pause-menu button { width: 240px; }
    #world-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
    .world-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.06); border: 1px solid #3a3a3a;
    }
    .world-info { flex: 1; min-width: 0; }
    .world-title { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .world-detail { font-size: 12px; color: #aaa; margin-top: 2px; }
    .world-empty { color: #888; padding: 8px 0; }
    #world-create { display: flex; flex-wrap: wrap; gap: 8px; }
    #world-create input {
      flex: 1 1 160px; min-width: 0;
      padding: 8px; background: #000; color: #fff;
      border: 2px solid #6b6b6b; font: 14px sans-serif;
    }
    .hint { font-size: 12px; color: #888; align-self: flex-start; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="crosshair">+</div>
  <div id="no-webgpu">
    WebGPU is not supported in this browser.<br />
    Try Chrome 113+ or Edge 113+.
  </div>
  <div id="block-name"></div>
  <div id="hotbar"></div>
  <div id="debug"></div>

  <!-- 시작 화면: 주소에 ?world=가 없을 때 보인다. 목록은 worldMenu.ts가 채운다 -->
  <div id="world-menu" class="overlay">
    <h1>VIW</h1>
    <div class="panel">
      <h2>월드 선택</h2>
      <ul id="world-list"></ul>
      <h2>새 월드 만들기</h2>
      <form id="world-create">
        <input id="world-name" maxlength="32" autocomplete="off" aria-label="월드 이름" />
        <input id="world-seed" placeholder="시드 (비우면 무작위)" autocomplete="off" aria-label="시드" />
        <button type="submit">만들기</button>
      </form>
      <div class="hint">시드는 숫자나 단어 모두 쓸 수 있어요. 같은 시드면 처음 지형이 같아요.</div>
    </div>
  </div>

  <!-- 일시정지 메뉴: 게임 중 마우스 잠금이 풀리면(ESC) 보인다 -->
  <div id="pause-menu" class="overlay">
    <h1 id="pause-title"></h1>
    <button id="resume">게임으로 돌아가기</button>
    <button id="exit-world">저장 후 나가기</button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
