name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 설치한다 — 로컬과 같은 버전으로 검사하기 위해서다
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
